<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>個人理財頁面</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-MKn5NWVBEuQXJE7TSKSgPUmMiSCmVTfCsR+VSSeQpHnoyJQZZFn/kBn+Ht5jZDPQ"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <nav class="navbar sm:navbar-expand bg-1 fg-2">
      <div class="container-fluid">
        <button
          class="btn-icon navbar-toggler"
          type="button"
          data-bs-toggle="drawer"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon" aria-hidden="true"></span>
        </button>
        <dialog
          class="drawer drawer-end"
          id="navbarNav"
          aria-labelledby="navbarNavLabel"
        >
          <div class="drawer-header">
            <h5 class="drawer-title" id="navbarNavLabel">Menu</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="drawer"
              aria-label="Close"
            ></button>
          </div>
          <div class="drawer-body">
            <a class="navbar-brand" href="#">個人理財網站</aclass>
            <ul class="navbar-nav">
              <li class="nav-item">
                <a class="nav-link" href="./index.html">首頁</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="./cash.html">現金庫存表單</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="./stock.html">股票庫存表單</a>
              </li>
            </ul>
          </div>
        </dialog>
      </div>
    </nav>

<div id="content" style="padding:2rem;">
    
<form onsubmit="return false">
  <div class="mb-3">
    <label for="taiwanese-dollars" class="form-label">台幣</label>
    <input
      type="number"
      class="form-control"
      id="taiwanese-dollars"
      name="taiwanese-dollars"
    />
  </div>

  <div class="mb-3">
    <label for="us-dollars" class="form-label">美金</label>
    <input
      step="0.01"
      type="number"
      class="form-control"
      id="us-dollars"
      name="us-dollars"
    />
  </div>

  <div class="mb-3">
    <label for="note" class="form-label">備註</label>
    <input type="text" class="form-control" id="note" name="note" />
  </div>

  <div class="mb-3">
    <label for="date" class="form-label">日期</label>
    <input type="date" class="form-control" id="date" name="date" />
  </div>
  <button type="submit" class="btn btn-primary">提交表單</button>
</form>

</div>


    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-+PW0IDVGGwmpaBQvcXY+W0BcpHpITFB3dSfSoGvDdHtLbrLpSbpGcvtQRM/BJpz+"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
